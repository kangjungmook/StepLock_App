name: 디버그 APK 빌드

# 컴퓨터 없이도 폰에 설치할 수 있도록, GitHub가 APK를 빌드해
# "debug" 릴리즈에 올려 둡니다. 폰 브라우저에서 바로 내려받을 수 있습니다.
# 이어서 릴리스 빌드(R8 축소)와 AAB도 만들어 스토어 업로드용을 검증합니다.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # secrets 컨텍스트는 step 의 if 에서 직접 못 읽는 경우가 있어 env 로 옮겨 둡니다.
      KEYSTORE_BASE64: ${{ secrets.STEPLOCK_KEYSTORE_BASE64 }}
      STEPLOCK_STORE_PASSWORD: ${{ secrets.STEPLOCK_STORE_PASSWORD }}
      STEPLOCK_KEY_ALIAS: ${{ secrets.STEPLOCK_KEY_ALIAS }}
      STEPLOCK_KEY_PASSWORD: ${{ secrets.STEPLOCK_KEY_PASSWORD }}
      # AdMob ID. 비밀값이 아니라(APK 안에 그대로 들어갑니다) Secrets 가 아닌
      # Variables 로 둡니다 — 값을 다시 열어 확인할 수 있어야 오타를 잡습니다.
      # Settings → Secrets and variables → Actions → Variables 탭에서 넣으세요.
      #
      # 비어 있으면 app/build.gradle.kts 가 구글 테스트 ID로 떨어집니다.
      # 값이 있어도 **릴리스(AAB)에만** 들어가고, 폰에 깔는 디버그 APK 는
      # 언제나 테스트 광고입니다.
      STEPLOCK_ADMOB_APP_ID: ${{ vars.STEPLOCK_ADMOB_APP_ID }}
      STEPLOCK_ADMOB_REWARDED: ${{ vars.STEPLOCK_ADMOB_REWARDED }}
      STEPLOCK_ADMOB_BANNER: ${{ vars.STEPLOCK_ADMOB_BANNER }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: assembleDebug
        id: debug_build
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace 2>&1 | tee build.log

      # 실행 로그는 Actions UI 밖에서 받기 어려우므로, 실패하면 이슈로 남겨
      # 어디서 깨졌는지 바로 볼 수 있게 합니다.
      - name: 디버그 빌드 실패를 이슈로
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./.github/report-build-failure.sh "디버그 빌드 실패"

      - name: APK 이름 정리
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/steplock-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: steplock-debug-apk
          path: out/steplock-debug.apk

      # 아티팩트는 zip으로 감싸여 내려오므로, 폰에서 바로 설치하려면 릴리즈가 편합니다.
      - name: debug 릴리즈에 올리기
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view debug >/dev/null 2>&1; then
            gh release upload debug out/steplock-debug.apk --clobber
          else
            gh release create debug out/steplock-debug.apk \
              --title "디버그 빌드 (설치용)" \
              --notes "main 브랜치를 빌드한 디버그 APK입니다. 테스트용이고 서명은 디버그 키입니다." \
              --prerelease
          fi

      # 여기부터는 스토어 업로드용입니다. 설치용 APK를 이미 올린 뒤에 실행해서,
      # R8 규칙 문제가 폰 테스트를 막지 않게 합니다.
      - name: 서명 키 준비 (시크릿이 있을 때만)
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "STEPLOCK_STORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      # 실 광고로 빌드됐는지 로그에서 바로 확인할 수 있게 합니다. 오타로 변수가
      # 안 읽히면 조용히 테스트 광고로 출시되는데, 그게 제일 찾기 어려운 실수입니다.
      - name: 릴리스가 어느 광고 ID로 빌드되는지
        run: |
          if [ -n "$STEPLOCK_ADMOB_APP_ID" ] \
            && [ -n "$STEPLOCK_ADMOB_REWARDED" ] \
            && [ -n "$STEPLOCK_ADMOB_BANNER" ]; then
            echo "릴리스(AAB): 실 AdMob ID — 앱 ID $STEPLOCK_ADMOB_APP_ID"
          else
            echo "릴리스(AAB): 구글 테스트 ID — Variables 가 비어 있습니다"
            echo "  APP_ID  설정됨? $([ -n "$STEPLOCK_ADMOB_APP_ID" ] && echo 예 || echo 아니요)"
            echo "  REWARDED 설정됨? $([ -n "$STEPLOCK_ADMOB_REWARDED" ] && echo 예 || echo 아니요)"
            echo "  BANNER  설정됨? $([ -n "$STEPLOCK_ADMOB_BANNER" ] && echo 예 || echo 아니요)"
          fi
          echo "디버그 APK 는 설정과 무관하게 언제나 테스트 광고입니다."

      - name: bundleRelease (AAB · R8 규칙 검증)
        run: |
          set -o pipefail
          ./gradlew bundleRelease --stacktrace 2>&1 | tee build.log

      # 디버그가 깨진 경우는 위에서 이미 이슈를 남겼으므로 중복을 막습니다.
      - name: 릴리스 빌드 실패를 이슈로
        if: failure() && steps.debug_build.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./.github/report-build-failure.sh "릴리스 빌드 실패 (R8 규칙 확인 필요)"

      - name: AAB 이름 정리
        run: |
          # 서명 시크릿이 없으면 파일 이름에 unsigned 가 붙습니다.
          AAB=$(find app/build/outputs/bundle/release -name '*.aab' | head -1)
          echo "찾은 AAB: $AAB"
          cp "$AAB" out/steplock-release.aab

      - uses: actions/upload-artifact@v4
        with:
          name: steplock-release-aab
          path: out/steplock-release.aab
